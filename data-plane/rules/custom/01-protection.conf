# ============================================================
# WAF Phase 1 — 自定义规则
# 放在 data-plane/rules/custom/ 下
# Coraza 会自动 Include /etc/caddy/custom/*.conf
# 规则 ID 范围：900000 - 999999（避免和 CRS 冲突）
# ============================================================

# --- 1. 封禁扫描器 User-Agent ---
SecRule REQUEST_HEADERS:User-Agent "@rx (?i)(sqlmap|nikto|nmap|masscan|nessus|acunetix|burpsuite|owasp|zap|metasploit|havij|commix)" \
    "id:900001,\
    phase:1,\
    block,\
    t:lowercase,\
    msg:'Scanner User-Agent Blocked',\
    severity:2,\
    tag:scanner"

# --- 2. 禁止 .env / .git 等敏感文件访问 ---
SecRule REQUEST_URI "@rx (?i)(\.env|\.git/|/\.htaccess|\.svn/|\.idea/|\.vscode/|web\.config)" \
    "id:900002,\
    phase:1,\
    block,\
    t:lowercase,\
    msg:'Sensitive File Access Blocked',\
    severity:2,\
    tag:info_leak"

# --- 3. 禁止常见管理后台扫描路径 ---
SecRule REQUEST_URI "@rx (?i)(/phpmyadmin|/admin\b|/administrator|/wp-admin/install|/setup\.php|/install\.php)" \
    "id:900003,\
    phase:1,\
    block,\
    msg:'Admin Path Scan Blocked',\
    severity:3,\
    tag:path_traversal"

# --- 4. 禁止请求中出现 eval(alert) 组合（典型 WebShell）---
SecRule ARGS "@rx (?i)(eval\s*\(|assert\s*\(|base64_decode\s*\(|system\s*\(|exec\s*\(|shell_exec\s*\(|passthru\s*\()" \
    "id:900004,\
    phase:2,\
    block,\
    msg:'Potential WebShell Payload Detected',\
    severity:4,\
    tag:webshell"

# --- 5. CC 防护：单 IP 每分钟超过 100 次请求 ---
# 注意：Phase 1 简化版，后续替换为 Redis 分布式计数
# Coraza 的 IP persistent storage 可以做简单计数
SecRule &TX:REQUEST_COUNT "@gt 100" \
    "id:900005,\
    phase:1,\
    block,\
    msg:'Rate Limit Exceeded (100 req/min)',\
    severity:3,\
    tag:cc_attack"

SecRule REQUEST_URI "@rx ." \
    "id:900006,\
    phase:1,\
    pass,\
    setvar:'ip.req_count=+1',\
    expirevar:'ip.req_count=60'" \
    chain
    SecRule TX:REQUEST_COUNT "@gt 0" "setvar:'tx.request_count=%{MATCHED_VAR}'"

# --- 6. 只允许常见 Content-Type ---
SecRule REQUEST_HEADERS:Content-Type "!@rx (?i)^(application/x-www-form-urlencoded|multipart/form-data|text/plain|application/json|text/xml|application/xml)" \
    "id:900007,\
    phase:1,\
    block,\
    msg:'Unusual Content-Type Blocked',\
    severity:2,\
    tag:protocol_abuse"

# --- 7. 禁止 URL 中出现的常见攻击协议 ---
SecRule ARGS "@rx (data:|javascript:|vbscript:|onmouseover|onerror|onload\s*=)" \
    "id:900008,\
    phase:2,\
    block,\
    msg:'Script Protocol Injection Blocked',\
    severity:3,\
    tag:xss"
