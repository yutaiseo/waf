<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Access Denied — WAF Protected</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 40px 60px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
            max-width: 500px;
        }
        .error-code {
            font-size: 72px;
            font-weight: bold;
            color: #e74c3c;
            margin: 0;
        }
        .title {
            font-size: 20px;
            color: #333;
            margin: 16px 0 8px;
        }
        .desc {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
        }
        .waf-tag {
            display: inline-block;
            margin-top: 20px;
            padding: 4px 12px;
            background: #fff3cd;
            color: #856404;
            border-radius: 4px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <p class="error-code">403</p>
        <h1 class="title">访问被拒绝</h1>
        <p class="desc">
            您的请求被 Web 应用防火墙（WAF）识别为恶意攻击并已被拦截。<br>
            如果这是一次正常访问，请联系网站管理员。
        </p>
        <p class="waf-tag">🛡️ Protected by Self-Hosted WAF (Coraza + Caddy)</p>
    </div>
</body>
</html>
